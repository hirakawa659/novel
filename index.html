<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>エディタ</title>
    <style>
        body { font-family: 'Hiragino Kaku Gothic ProN', sans-serif; background: #fafafa; margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; -webkit-text-size-adjust: 100%; }
        #mainContainer { display: flex; flex-grow: 1; height: calc(100vh - 55px); width: 100%; overflow: hidden; }
        #sidebar { width: 220px; background: #f0f0f4; border-right: 1px solid #ddd; display: flex; flex-direction: column; padding: 10px; flex-shrink: 0; height: 100%; box-sizing: border-box; }
        .sidebar-btn { padding: 5px; font-size: 12px; cursor: pointer; margin-bottom: 5px; width: 100%; }
        #treeRoot { overflow-y: auto; flex-grow: 1; font-size: 14px; }
        .item-label { padding: 4px; border-radius: 4px; cursor: pointer; }
        .item-label.active { background: #e4e4e7; font-weight: bold; }
        .main-content { flex-grow: 1; display: flex; flex-direction: column; height: 100%; width: 100%; overflow: hidden; }
        
        /* ボタンメニューを画面最上部に完全溶接（高さ55px固定） */
        .controls { display: flex; gap: 8px; background: #fff; padding: 10px; border-bottom: 1px solid #ddd; align-items: center; flex-wrap: wrap; width: 100%; box-sizing: border-box; flex-shrink: 0; height: 55px; }
        button { padding: 6px 10px; font-size: 12px; font-weight: bold; cursor: pointer; background: #f0f0f2; border: 1px solid #ccc; border-radius: 4px; }
        .btn-check { background: #e0f2fe; color: #0369a1; }
        .counter { font-size: 13px; margin-right: 10px; }
        
        .editor-container { flex-grow: 1; padding: 20px; overflow-y: auto; overflow-x: auto; display: flex; justify-content: flex-start; align-items: flex-start; box-sizing: border-box; height: 100%; width: 100%; }
        .editor-wrapper { display: flex; background: #fff; border: 1px solid #ddd; border-radius: 6px; min-height: 600px; width: var(--wrapper-width, 1100px) !important; max-width: var(--wrapper-width, 1100px) !important; box-sizing: border-box; overflow: hidden; flex-shrink: 0; }
        .line-numbers { width: 45px; border-right: 1px solid #eee; padding: 24px 0; text-align: right; font-size: 16px; color: #aaa; padding-right: 8px; user-select: none; font-family: monospace; flex-shrink: 0; box-sizing: border-box; line-height: 35px !important; }
        
        /* 1文字＝縦横35pxの完全等幅正方形。特殊文字バグを力技で防ぐ指定 */
        #editor {
            flex-grow: 1; padding: 24px; outline: none; white-space: pre-wrap; word-wrap: break-word; display: block !important; box-sizing: border-box;
            width: var(--editor-width, 1000px) !important; max-width: var(--editor-width, 1000px) !important; overflow: hidden;
            font-family: 'Hiragino Kaku Gothic ProN', monospace; font-size: 35px !important; line-height: 35px !important;
            letter-spacing: 0px !important; font-kerning: none !important; text-transform: full-width !important; font-variant-numeric: tabular-nums !important; text-align: left !important;
        }
        #editor div * { font-size: 100% !important; vertical-align: baseline !important; position: static !important; display: inline-block !important; width: 1em !important; max-width: 1em !important; min-width: 1em !important; text-align: center !important; line-height: inherit !important; box-sizing: border-box !important; margin: 0 !important; padding: 0 !important; }
        #editor div { min-height: 35px !important; height: 35px !important; display: block !important; box-sizing: border-box; overflow: hidden; text-align: left !important; background-image: linear-gradient(to right, #ececec 1px, transparent 1px), linear-gradient(to bottom, #ececec 1px, transparent 1px) !important; background-size: 35px 35px !important; background-repeat: repeat !important; width: 100% !important; letter-spacing: 0px !important; padding-left: 0px; margin: 0; }
        #editor div:empty::before, #editor br:only-child::before { content: "【空行】"; color: #ef4444; font-size: 12px; background: #fef2f2; padding: 1px 4px; letter-spacing: normal; display: inline-block !important; width: auto !important; }
        .zenkaku-space { background-color: #f4f4f5; color: #aaa; display: inline-block !important; width: 35px !important; text-align: center; }
        .zenkaku-space::before { content: "▢"; font-size: 14px; }
        
        /* 半角スペース背景グレー色固定 */
        .hankaku-space { background-color: #e4e4e7 !important; color: #71717a !important; display: inline-block !important; width: 35px !important; text-align: center; border-radius: 2px; }
        .hankaku-space::before { content: "·"; font-size: 14px; font-weight: bold; }
        .hidden-char { border: 2px dashed #a855f7 !important; background: #f3e8ff !important; }
        .homograph-char { border: 2px dashed #f97316 !important; background: #ffedd5 !important; display: inline-block !important; width: 35px !important; text-align: center; }
        .proof-error { background-color: #fce7f3 !important; border-bottom: 2px dotted #db2777 !important; display: inline-block !important; }
        #proofPanel { background: #fff; border: 1px solid #ddd; padding: 15px; margin-top: 10px; display: none; font-size: 14px; width: 100%; box-sizing: border-box; }
        .proof-item { margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px dashed #eee; line-height: 1.5; }
    </style>
</head>
