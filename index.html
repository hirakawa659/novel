<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Editor</title><style>
:root{--cs:32px}
html,body{margin:0;padding:0;width:100%;height:100%;height:100dvh;overflow:hidden;position:fixed;top:0;left:0;right:0;bottom:0;font-family:monospace}
.h{position:fixed;top:0;left:0;right:0;width:100%;display:flex;gap:6px;padding:8px;background:#fff;border-bottom:1px solid #ddd;height:50px;box-sizing:border-box;align-items:center;z-index:999;flex-shrink:0}
button{padding:6px 10px;font-size:12px;font-weight:bold;cursor:pointer;background:#f0f0f2;border:1px solid #ccc;border-radius:4px}
#b{display:flex;position:fixed;top:50px;bottom:0;left:0;right:0;width:100%;height:calc(100% - 50px);height:calc(100dvh - 50px);overflow:hidden}
#s{width:200px;background:#f0f0f4;border-right:1px solid #ddd;padding:8px;display:flex;flex-direction:column;gap:4px;flex-shrink:0}
.m{flex:1;padding:12px;padding-bottom:75vh;overflow-y:auto;overflow-x:hidden;box-sizing:border-box;display:flex;justify-content:center;-webkit-overflow-scrolling:touch}
#w{display:flex;background:#fff;border:1px solid #ddd;border-radius:6px;min-height:500px;box-sizing:border-box;flex-shrink:0;margin:0 auto}
.l{width:36px;border-right:1px solid #eee;padding:12px 0;text-align:right;font-size:12px;color:#aaa;padding-right:6px;user-select:none;flex-shrink:0;box-sizing:border-box;line-height:var(--cs)!important}
#e{flex-grow:1;padding:12px 0;outline:0;white-space:pre-wrap;word-wrap:break-word;word-break:break-all;display:block!important;box-sizing:border-box;font-size:var(--cs)!important;line-height:var(--cs)!important;letter-spacing:0px!important;text-align:left!important;caret-color:#2563eb;background-image:linear-gradient(90deg,#ececec 1px,transparent 1px),linear-gradient(#ececec 1px,transparent 1px)!important;background-size:var(--cs) var(--cs)!important;background-repeat:repeat!important;background-position:0 12px!important}
#e div{min-height:var(--cs)!important;display:block!important;box-sizing:border-box;text-align:left!important;background-image:linear-gradient(90deg,#ececec 1px,transparent 1px),linear-gradient(#ececec 1px,transparent 1px)!important;background-size:var(--cs) var(--cs)!important;background-repeat:repeat!important;width:100%!important;margin:0;padding:0}
#e span{display:inline-block!important;width:var(--cs)!important;height:var(--cs)!important;line-height:var(--cs)!important;text-align:center!important;box-sizing:border-box!important;margin:0!important;padding:0!important;font-size:calc(var(--cs)*0.8)!important}
.sp{background:#e4e4e7!important;color:#71717a!important;border-radius:2px}
.hm{border:2px dashed #f97316!important;background:#ffedd5!important}
.er{background-color:#fce7f3!important;border-bottom:2px dotted #db2777!important}
#t{overflow-y:auto;flex:1;font-size:13px}
</style></head>
<body>
<div class="h">
<button onclick="u()">戻</button><button onclick="document.execCommand('undo')">撤</button><button onclick="document.execCommand('redo')">進</button>
<button onclick="c()">複</button><button onclick="fx()" style="background:#e0f2fe;color:#0369a1">修</button>
<select id="l" onchange="z()"></select><span id="k" style="font-size:13px;margin-left:5px">0字</span>
</div>
<div id="b">
<div id="s">
<div style="display:flex;gap:4px"><button onclick="a(1)" style="flex:1">+折</button><button onclick="a(0)" style="flex:1">+話</button></div><div id="t"></div>
</div>
<div class="m"><div id="w"><div class="l" id="n">1</div><div id="e" contenteditable="true"><div><br></div></div></div></div>
</div>
<script>
const e=document.getElementById('e'),l=document.getElementById('l'),t=document.getElementById('t'),k=document.getElementById('k'),w=document.getElementById('w'),n=document.getElementById('n');
let d={r:[]},f=null,pId=null;
for(let i=20; i<=40; i++)l.innerHTML+=`<option value="${i}">${i}字</option>`;l.value="30";
window.onload=()=>{
    try{document.execCommand('defaultParagraphSeparator', false, 'div');}catch(err){}
    let s=localStorage.getItem('n_d'),sw=localStorage.getItem('n_w'),sc=localStorage.getItem('n_c'),sr=localStorage.getItem('n_r');
    if(s){d=JSON.parse(s)}else{let id='d_'+Date.now();d.r.push({id,type:'file',name:'第1話',content:'<div><br></div>'});f=id}
    if(sc)f=sc;if(sw)l.value=sw;r();o(f);if(sr&&sr!=="<div><br></div>")e.innerHTML=sr;
    norm();z();v();
};
function norm(){
    if(!e.innerHTML.trim()){e.innerHTML='<div><br></div>';return}
    let hasRawText=false;
    for(let n of e.childNodes){
        if(n.nodeType===3 && n.nodeValue.trim()){hasRawText=true;break}
        if(n.nodeType===1 && n.tagName!=='DIV'){hasRawText=true;break}
    }
    if(hasRawText){
        let lines=e.innerText.split('\n');
        e.innerHTML=lines.map(l=>`<div>${l?l:'<br>'}</div>`).join('');
    }
}
function z(){
    let v=l.value;let num=parseInt(v);if(!num||isNaN(num))num=30;
    const m=document.querySelector('.m');
    const mWidth=m?m.clientWidth:(window.innerWidth-200);
    const pad=24,lw=36,border=2;
    let avail=mWidth-pad-lw-border;
    if(avail<100)avail=100;
    let cs=Math.floor(avail/num);
    if(cs<12)cs=12;if(cs>64)cs=64;
    const pw=cs*num;
    const totalW=pw+lw+border;
    document.documentElement.style.setProperty('--cs',cs+'px');
    w.style.width=totalW+'px';
    e.style.width=pw+'px';
    localStorage.setItem('n_w',v);
}
function v(){
    let divs=e.querySelectorAll('#e>div');
    let c=divs.length;
    if(c===0){let lines=e.innerText.split('\n').filter(Boolean);c=lines.length>0?lines.length:1}
    let h='';for(let i=1; i<=c; i++)h+=i+'<br>';
    n.innerHTML=h;
    k.textContent=e.innerText.replace(/\n/g,'').replace(/·/g,' ').replace(/▢/g,' ').length+'字'
}
function o(id){let i=g(id);if(i){e.innerHTML=(i.content&&i.content.trim())?i.content:'<div><br></div>';f=id;localStorage.setItem('n_c',id)}norm();z();v()}
function s(){let i=g(f);if(i){i.content=e.innerHTML;localStorage.setItem('n_d',JSON.stringify(d))}}
function g(id,items=d.r){for(let i of items){if(i.id===id)return i;if(i.children){let found=g(id,i.children);if(found)return found}}return null}
function r(){t.innerHTML='';d.r.forEach(i=>t.appendChild(m(i,null)))}
function m(i,pid){
    let div=document.createElement('div');div.style.paddingLeft='8px';
    let lbl=document.createElement('div');lbl.textContent=(i.type==='folder'?'📁 ':'📄 ')+i.name;lbl.style.cursor='pointer';lbl.style.padding='4px';if(i.id===f)lbl.style.backgroundColor='#e4e4e7';
    lbl.onclick=(ev)=>{ev.stopPropagation();if(i.type=='file'){s();o(i.id);r()}else{pId=i.id}};
    lbl.ondblclick=(ev)=>{ev.stopPropagation();let n=prompt('名:',i.name);if(n){i.name=n;s();r()}};
    div.appendChild(lbl);if(i.children)i.children.forEach(ch=>div.appendChild(m(ch,i.id)));return div;
}
function a(isF){
    let n=prompt(isF?'フォルダ名:':'話名:');if(!n)return;let id='i_'+Date.now(),ni={id,type:isF?'folder':'file',name:n};
    if(isF)ni.children=[];else ni.content='<div><br></div>';
    if(pId){let p=g(pId);if(p&&p.type==='folder')p.children.push(ni)}else{d.r.push(ni)}
    s();if(!isF)f=id;r();o(f);
}
function u(){pId=null;alert('最上層')}

/* 【修】ボタン：文字入力の邪魔をせず、一瞬であらゆる特殊文字・半角を正方形の箱に閉じ込め一括補正＆校正する最強機能 */
function fx(){
    norm();
    let divs=e.querySelectorAll('#e>div');if(divs.length===0){e.innerHTML='<div>'+e.innerHTML+'</div>';divs=e.querySelectorAll('#e>div')}
    divs.forEach(d=>{
        let txt=d.innerText;if(txt==='\n'||txt==='')return;let h='';
        for(let i=0;i<txt.length;i++){
            let c=txt[i];
            if(c===' '){h+=`<span class="sp">·</span>`}
            else if(c==='　'){h+=`<span class="sp" style="background:#f4f4f5!important;color:#aaa!important">▢</span>`}
            else if(/[口工二卜]|[^\u0000-\u007F\u3040-\u309F\u30A0-\u30FF\u4E00-\u9FFF\u3000-\u303F]/.test(c)){h+=`<span class="hm">${c}</span>`}
            else if(c==='言'&&txt[i+1]==='頭'){h+=`<span class="er">言</span>`;h+=`<span class="er">頭</span>`;i++}
            else{h+=`<span>${c}</span>`}
        }
        d.innerHTML=h;
    });
    alert('✨ 特殊文字の1マス強制ロック、半角スペース色付け、ホモグラフ・誤字の一括チェックが完了しました！');
    v();s();
}

/* 複（コピー）ボタン：画面表示用の箱を消して、本物のきれいな文章に戻してクリップボードに送る設定 */
function c(){
    let t=e.innerText.replace(/·/g,' ').replace(/▢/g,'　');
    navigator.clipboard.writeText(t).then(()=>alert('きれいな小説文章をコピーしました！'));
}

function sc(){
    setTimeout(()=>{
        let sel=window.getSelection();if(!sel||sel.rangeCount===0)return;
        let r=sel.getRangeAt(0),node=r.startContainer;
        if(node.nodeType===3)node=node.parentNode;
        while(node&&node!==e&&node.parentElement!==e){node=node.parentElement}
        if(node&&node.parentElement===e){node.scrollIntoView({block:'nearest',behavior:'smooth'})}
    },30);
}
e.oninput=()=>{v();s();localStorage.setItem('n_r',e.innerHTML);sc()};
e.onkeydown=(ev)=>{if(ev.key==='Enter')setTimeout(()=>{v();sc()},10)};
window.addEventListener('scroll',()=>{if(window.scrollY!==0||window.scrollX!==0)window.scrollTo(0,0)});
e.addEventListener('focus',()=>{setTimeout(()=>{window.scrollTo(0,0);sc()},50)});
if(window.visualViewport){
    window.visualViewport.addEventListener('resize',()=>{window.scrollTo(0,0)});
    window.visualViewport.addEventListener('scroll',()=>{window.scrollTo(0,0)});
}
window.addEventListener('resize',()=>{z();window.scrollTo(0,0)});
if(window.ResizeObserver){
    new ResizeObserver(()=>{z()}).observe(document.querySelector('.m'));
}
</script></body></html>
