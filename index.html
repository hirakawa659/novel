<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>エディタ</title>
    <style>
        body { font-family: 'Hiragino Kaku Gothic ProN', sans-serif; background: #fafafa; margin: 0; padding: 0; display: flex; height: 100vh; overflow: hidden; -webkit-text-size-adjust: 100%; }
        #sidebar { width: 220px; background: #f0f0f4; border-right: 1px solid #ddd; display: flex; flex-direction: column; padding: 10px; flex-shrink: 0; }
        .sidebar-btn { padding: 5px; font-size: 12px; cursor: pointer; margin-bottom: 5px; width: 100%; }
        #treeRoot { overflow-y: auto; flex-grow: 1; font-size: 14px; }
        .item-label { padding: 4px; border-radius: 4px; cursor: pointer; }
  　.item-label.active { background: #e4e4e7; font-weight: bold; }
        .main-content { flex-grow: 1; display: flex; flex-direction: column; height: 100vh; width: 100%; overflow: hidden; position: relative; }
        .controls { display: flex; gap: 8px; background: #fff; padding: 10px; border-bottom: 1px solid #ddd; align-items: center; flex-wrap: wrap; width: 100%; box-sizing: border-box; flex-shrink: 0; }
        button { padding: 6px 10px; font-size: 12px; font-weight: bold; cursor: pointer; background: #f0f0f2; border: 1px solid #ccc; border-radius: 4px; }
        .btn-check { background: #e0f2fe; color: #0369a1; }
        .counter { font-size: 13px; margin-right: 10px; }
        .editor-container { flex-grow: 1; padding: 20px; overflow-y: auto; overflow-x: hidden; display: flex; justify-content: flex-start; align-items: flex-start; width: 100%; box-sizing: border-box; }
        .editor-wrapper { display: flex; background: #fff; border: 1px solid #ddd; border-radius: 6px; min-height: 600px; width: var(--wrapper-width, max-content) !important; max-width: var(--wrapper-width, max-content) !important; box-sizing: border-box; overflow: hidden; }
        .line-numbers { width: 45px; border-right: 1px solid #eee; padding: 24px 0; text-align: right; font-size: 16px; color: #aaa; padding-right: 8px; user-select: none; font-family: monospace; flex-shrink: 0; }
        #editor {
            flex-grow: 1; padding: 24px; outline: none; white-space: pre-wrap; word-wrap: break-word; display: block !important; box-sizing: border-box; width: var(--editor-width, 100%) !important; max-width: var(--editor-width, 100%) !important; overflow: hidden;
            font-family: 'Hiragino Kaku Gothic ProN', monospace; font-size: var(--cell-size, 32px) !important; line-height: var(--cell-size, 32px) !important; letter-spacing: 0px !important; font-kerning: none !important; text-transform: full-width !important; font-variant-numeric: tabular-nums; text-align: left !important;
        }
        #editor div * { font-size: 100% !important; vertical-align: baseline !important; position: static !important; display: inline-block !important; width: 1em !important; text-align: center !important; }
        #editor div {
            min-height: var(--cell-size, 32px) !important; height: var(--cell-size, 32px) !important; display: block !important; box-sizing: border-box; overflow: hidden; text-align: left !important;
            background-image: linear-gradient(to right, #ececec 1px, transparent 1px), linear-gradient(to bottom, #ececec 1px, transparent 1px) !important; background-size: var(--cell-size, 32px) var(--cell-size, 32px) !important; background-repeat: repeat !important; width: 100% !important; letter-spacing: 0px !important; padding-left: 0px; margin: 0;
        }
        #editor div:empty::before, #editor br:only-child::before { content: "【空行】"; color: #ef4444; font-size: 12px; background: #fef2f2; padding: 1px 4px; letter-spacing: normal; display: inline-block !important; width: auto !important; }
        .zenkaku-space { background-color: #f4f4f5; color: #aaa; display: inline-block !important; width: var(--cell-size, 32px) !important; text-align: center; }
        .zenkaku-space::before { content: "▢"; font-size: 14px; }
        .hankaku-space { background-color: #f4f4f5; color: #bbb; display: inline-block !important; width: calc(var(--cell-size, 32px) / 2) !important; text-align: center; }
        .hankaku-space::before { content: "·"; font-size: 14px; }
        .hidden-char { border: 2px dashed #a855f7 !important; background: #f3e8ff !important; }
        .homograph-char { border: 2px dashed #f97316 !important; background: #ffedd5 !important; display: inline-block !important; width: var(--cell-size, 32px) !important; text-align: center; }
        .proof-error { background-color: #fce7f3 !important; border-bottom: 2px dotted #db2777 !important; display: inline-block !important; }
        #proofPanel { background: #fff; border: 1px solid #ddd; padding: 15px; margin-top: 10px; display: none; font-size: 14px; width: 100%; box-sizing: border-box; }
        .proof-item { margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px dashed #eee; line-height: 1.5; }
    </style>
</head>
<body>
<div id="sidebar">
    <button class="sidebar-btn" onclick="toggleSidebar()">◀ メニューを閉じる</button>
    <div style="display:flex; gap:4px;"><button class="sidebar-btn" onclick="addFolder()">+フォルダ</button><button class="sidebar-btn" onclick="addFile()">+新しい話</button></div>
    <div id="treeRoot"></div>
</div>
<div class="main-content">
    <div class="controls">
        <button onclick="toggleSidebar()" id="mainMenuBtn" style="display:none;">▶ メニューを開く</button>
        <button onclick="goToParentFolder()">戻る</button>
        <button onclick="document.execCommand('undo')">取り消し</button>
        <button onclick="document.execCommand('redo')">やり直し</button>
        <button onclick="document.execCommand('cut')">カット</button>
        <button onclick="copyText()">コピー</button>
        <button class="btn-check" onclick="checkHiddenChars()">隠し文字</button>
        <button class="btn-check" onclick="checkHomographs()">ホモグラフ</button>
        <button class="btn-check" onclick="checkProofread()">誤字チェック</button>
        <div class="select-wrapper"><label>1行:</label><select id="widthSelect" onchange="changeWidth()"></select></div>
        <div class="counter"><span id="charCount">0</span> 文字</div>
        <span id="saveStatus" style="font-size:12px; color:#aaa;">保存完了</span>
    </div>
    <div class="editor-container">
        <div class="editor-wrapper" id="editorWrapper"><div class="line-numbers" id="lineNumbers">1</div><div id="editor" contenteditable="true"><div><br></div></div></div>
        <div id="proofPanel"><b style="color:#db2777; font-size:16px;">🔍 自動指摘・一括校正アドバイス一覧</b><hr><div id="proofList"></div></div>
    </div>
</div>
    <script>
const editor = document.getElementById('editor'), lineNumbers = document.getElementById('lineNumbers'), charCount = document.getElementById('charCount');
const widthSelect = document.getElementById('widthSelect'), treeRoot = document.getElementById('treeRoot'), editorWrapper = document.getElementById('editorWrapper');
const sidebar = document.getElementById('sidebar'), mainMenuBtn = document.getElementById('mainMenuBtn'), proofPanel = document.getElementById('proofPanel'), proofList = document.getElementById('proofList');
let fsData = { root: [] }, currentFileId = null, currentParentFolderId = null;

function initSelect() {
    widthSelect.innerHTML = '<option value="max">画面幅</option>';
    for(let i = 20; i <= 40; i++) {
        let opt = document.createElement('option'); opt.value = i; opt.textContent = i + '字';
        widthSelect.appendChild(opt);
    }
}
function hardResetBugs() { localStorage.removeItem('novel_fs_data'); localStorage.removeItem('novel_current_id'); localStorage.removeItem('novel_raw_emergency'); }

window.addEventListener('DOMContentLoaded', () => {
    if (!localStorage.getItem('bug_fix_v7_done')) { hardResetBugs(); localStorage.setItem('bug_fix_v7_done', 'true'); }
    initSelect();
    const savedFs = localStorage.getItem('novel_fs_data'), savedWidth = localStorage.getItem('novel_width'), savedCurrent = localStorage.getItem('novel_current_id'), savedRaw = localStorage.getItem('novel_raw_emergency');
    if (savedFs) { fsData = JSON.parse(savedFs); } else {
        const fid = 'f_' + Date.now(), docid = 'd_' + Date.now();
        fsData.root.push({ id: fid, type: 'folder', name: '作品フォルダ', children: [{ id: docid, type: 'file', name: '第1話', content: '<div><br></div>' }] });
        currentFileId = docid;
    }
    widthSelect.value = savedWidth ? savedWidth : "30";
    renderTree(); loadFile(currentFileId); if (savedRaw) { editor.innerHTML = savedRaw; } changeWidth(); updateLines(); window.addEventListener('resize', changeWidth);
});
function toggleSidebar() { if (sidebar.style.display === 'none') { sidebar.style.display = 'flex'; mainMenuBtn.style.display = 'none'; } else { sidebar.style.display = 'none'; mainMenuBtn.style.display = 'block'; } setTimeout(changeWidth, 100); }
function updateLines() { const divs = editor.querySelectorAll('#editor > div'); let count = divs.length === 0 ? 1 : divs.length, html = ''; for(let i=1; i<=count; i++) { html += i + '<br>'; } lineNumbers.innerHTML = html; charCount.textContent = editor.innerText.replace(/\n/g, '').length; }
function changeWidth() { const val = widthSelect.value; if (val === 'max') { document.documentElement.style.setProperty('--cell-size', '32px'); document.documentElement.style.setProperty('--wrapper-width', '100%'); document.documentElement.style.setProperty('--editor-width', '100%'); } else { const num = parseInt(val); const cellSize = 32, editorPixelWidth = num * cellSize, wrapperPixelWidth = editorPixelWidth + 45 + 48; document.documentElement.style.setProperty('--cell-size', cellSize + 'px'); document.documentElement.style.setProperty('--wrapper-width', wrapperPixelWidth + 'px'); document.documentElement.style.setProperty('--editor-width', editorPixelWidth + 'px'); } const currentGrid = document.documentElement.style.getPropertyValue('--cell-size') || '32px'; lineNumbers.style.fontSize = `calc(${currentGrid} * 0.55)`; lineNumbers.style.lineHeight = currentGrid; }
function goToParentFolder() { if (currentParentFolderId) { const p = findItem(currentParentFolderId); if (p) alert('「' + p.name + '」に戻りました'); } else { alert('最上層です'); } }
function copyText() { clearStyle(); navigator.clipboard.writeText(editor.innerText).then(() => alert('コピーしました')); }
function clearStyle() { proofPanel.style.display = 'none'; const temp = document.createElement('div'); temp.innerHTML = editor.innerHTML; temp.querySelectorAll('.hidden-char, .homograph-char, .proof-error').forEach(s => { const p = s.parentNode; while (s.firstChild) { p.insertBefore(s.firstChild, s); } p.removeChild(s); }); editor.innerHTML = temp.innerHTML; }
function checkHiddenChars() { clearStyle(); let u = false; editor.querySelectorAll('#editor > div').forEach(d => { let t = d.innerHTML; const r = /([\u200B-\u200D\uFEFF\u0000-\u0008\u000B\u000C\u000E-\u001F])/g; if (r.test(t)) { d.innerHTML = t.replace(r, '<span class="hidden-char">$1</span>'); u = true; } }); alert(u ? '⚠️隠し文字検出' : 'クリーンです'); }
function checkHomographs() { clearStyle(); let u = false; editor.querySelectorAll('#editor > div').forEach(d => { const r = /([口工二卜]|[^\u0000-\u007F\u3040-\u309F\u30A0-\u30FF\u4E00-\u9FFF\u3000-\u303F])/g; if (r.test(d.innerText)) { d.innerHTML = d.innerHTML.replace(r, '<span class="homograph-char">$1</span>'); u = true; } }); alert(u ? '⚠️ホモグラフ・外国文字を検出！' : 'なし'); }
function checkProofread() { clearStyle(); let idx = 1, lists = []; const rules = [{ p: /言頭/g, m: '「行頭」の誤字疑い' }, { p: /言までもない/g, m: '「言うまでもない」の脱字疑い' }, { p: /([、。・])\1+/g, m: '記号が連続しています' }, { p: /(ですが|けれど)。*(ですが|けれど)/g, m: '1文中に同じ接続詞が重複しています' }, { p: /([^分])かって/g, m: '「買って」「勝って」などのタイポ確認' }]; editor.querySelectorAll('#editor > div').forEach(d => { let html = d.innerHTML, txt = d.innerText; rules.forEach(r => { if (r.p.test(txt)) { html = html.replace(r.p, (m) => { lists.push(`<div class="proof-item"><b>【指摘 ${idx}】</b> 「${m}」 ➔ ${r.m}</div>`); return `<span class="proof-error">${m}</span>`; }); d.innerHTML = html; } }); }); if (lists.length > 0) { proofList.innerHTML = lists.join(''); proofPanel.style.display = 'block'; alert(`🔍 気になる点を ${idx-1} 箇所検出！`); } else { alert('エラーなし'); } }
function renderTree() { treeRoot.innerHTML = ''; fsData.root.forEach(item => treeRoot.appendChild(createElement(item, null))); }
function createElement(item, pid) { const div = document.createElement('div'); div.className = 'tree-item'; const lbl = document.createElement('div'); lbl.className = 'item-label'; if (item.id === currentFileId) lbl.classList.add('active'); lbl.textContent = (item.type === 'folder' ? '📁 ' : '📄 ') + item.name; lbl.addEventListener('click', (e) => { e.stopPropagation(); if (item.type === 'file') { saveFile(); currentFileId = item.id; currentParentFolderId = pid; localStorage.setItem('novel_current_id', currentFileId); loadFile(currentFileId); renderTree(); } else { currentParentFolderId = item.id; } }); lbl.addEventListener('dblclick', (e) => { e.stopPropagation(); const n = prompt('名前変更:', item.name); if (n) { item.name = n; saveFS(); renderTree(); } }); div.appendChild(lbl); if (item.type === 'folder' && item.children) { const c = document.createElement('div'); item.children.forEach(ch => c.appendChild(createElement(ch, item.id))); div.appendChild(c); } return div; }
function addFolder() { const n = prompt('フォルダ名:', '新しいフォルダ'); if (!n) return; if (currentParentFolderId) { const p = findItem(currentParentFolderId); if (p && p.type === 'folder') p.children.push({ id: 'f_'+Date.now(), type: 'folder', name: n, children: [] }); } else { fsData.root.push({ id: 'f_'+Date.now(), type: 'folder', name: n, children: [] }); } saveFS(); renderTree(); }
function addFile() { const n = prompt('話の名前:', '新しい話'); if (!n) return; const nid = 'd_' + Date.now(); if (currentParentFolderId) { const p = findItem(currentParentFolderId); if (p && p.type === 'folder') p.children.push({ id: nid, type: 'file', name: n, content: '<div><br></div>' }); } else { fsData.root.push({ id: nid, type: 'file', name: n, content: '<div><br></div>' }); } saveFS(); currentFileId = nid; localStorage.setItem('novel_current_id', currentFileId); loadFile(nid); renderTree(); }
function findItem(id, items = fsData.root) { for (let item of items) { if (item.id === id) return item; if (item.children) { const f = findItem(id, item.children); if (f) return f; } } return null; }
function loadFile(id) { const file = findItem(id); editor.innerHTML = file ? file.content : '<div><br></div>'; changeWidth(); updateLines(); }
function saveFile() { const file = findItem(currentFileId); if (file) { file.content = editor.innerHTML; saveFS(); } }
function saveFS() { localStorage.setItem('novel_fs_data', JSON.stringify(fsData)); }
editor.addEventListener('input', () => { updateLines(); saveFile(); localStorage.setItem('novel_raw_emergency', editor.innerHTML); });
editor.addEventListener('keydown', (e) => { if (e.key === 'Enter') { setTimeout(() => { changeWidth(); updateLines(); }, 10); } });
</script>
</body>
</html>
