<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>エディタ</title>
    <style>
        body { font-family: monospace; background: #fafafa; margin: 0; padding: 0; display: flex; height: 100vh; overflow: hidden; -webkit-text-size-adjust: 100%; }
        #sidebar { width: 220px; background: #f0f0f4; border-right: 1px solid #ddd; display: flex; flex-direction: column; padding: 10px; flex-shrink: 0; }
        .sidebar-btn { padding: 5px; font-size: 12px; cursor: pointer; margin-bottom: 5px; width: 100%; }
        #treeRoot { overflow-y: auto; flex-grow: 1; font-size: 14px; }
        .item-label { padding: 4px; border-radius: 4px; cursor: pointer; }
        .item-label.active { background: #e4e4e7; font-weight: bold; }
        .main-content { flex-grow: 1; display: flex; flex-direction: column; height: 100vh; }
        .controls { display: flex; gap: 8px; background: #fff; padding: 10px; border-bottom: 1px solid #ddd; align-items: center; flex-wrap: wrap; }
        button { padding: 6px 10px; font-size: 12px; font-weight: bold; cursor: pointer; background: #f0f0f2; border: 1px solid #ccc; border-radius: 4px; }
        .btn-check { background: #e0f2fe; color: #0369a1; }
        .counter { font-size: 13px; margin-right: 10px; }
        
        /* 常に画面幅に収めるためのコンテナ設定 */
        .editor-container { flex-grow: 1; padding: 20px; overflow-y: auto; overflow-x: hidden; display: flex; justify-content: center; }
        .editor-wrapper { display: flex; background: #fff; border: 1px solid #ddd; border-radius: 6px; min-height: 600px; width: 100%; box-sizing: border-box; }
        /* 行番号の幅を固定 */
        .line-numbers { width: 45px; border-right: 1px solid #eee; padding: 24px 0; text-align: right; font-size: 16px; color: #aaa; padding-right: 8px; user-select: none; font-family: monospace; flex-shrink: 0; }
        
        /* JavaScriptで1マスのサイズ（--grid-size）を動的に変える設定 */
        #editor {
            flex-grow: 1;
            padding: 24px;
            outline: none;
            white-space: pre-wrap;
            word-wrap: break-word;
            display: block;
            font-family: monospace;
            box-sizing: border-box;
            font-size: var(--grid-size, 20px);
            line-height: calc(var(--grid-size, 20px) * 2);
        }
        #editor div {
            min-height: calc(var(--grid-size, 20px) * 2);
            height: calc(var(--grid-size, 20px) * 2);
            display: block;
            box-sizing: border-box;
            background-image: 
                linear-gradient(to right, #ececec 1px, transparent 1px),
                linear-gradient(to bottom, #ececec 1px, transparent 1px);
            background-size: var(--grid-size, 20px) calc(var(--grid-size, 20px) * 2);
            background-repeat: repeat;
            width: 100%;
            letter-spacing: var(--grid-size, 20px);
            padding-left: calc(var(--grid-size, 20px) / 2);
        }
        #editor div:empty::before, #editor br:only-child::before { content: "【空行】"; color: #ef4444; font-size: 12px; background: #fef2f2; padding: 1px 4px; letter-spacing: normal; }
        
        .zenkaku-space { background-color: #f4f4f5; color: #aaa; display: inline-block; width: var(--grid-size, 20px); text-align: center; letter-spacing: normal; }
        .zenkaku-space::before { content: "▢"; font-size: 14px; }
        .hankaku-space { background-color: #f4f4f5; color: #bbb; display: inline-block; width: calc(var(--grid-size, 20px) / 2); text-align: center; letter-spacing: normal; }
        .hankaku-space::before { content: "·"; font-size: 14px; }
        .hidden-char { border: 2px dashed #a855f7 !important; background: #f3e8ff !important; }
        .homograph-char { border: 2px dashed #f97316 !important; background: #ffedd5 !important; }
        .proof-error { background-color: #fce7f3 !important; border-bottom: 2px dotted #db2777 !important; }
        #proofPanel { background: #fff; border: 1px solid #ddd; padding: 10px; margin-top: 10px; display: none; font-size: 13px; width: 100%; box-sizing: border-box; }
    </style>
</head>
<body>
<div id="sidebar">
    <button class="sidebar-btn" onclick="toggleSidebar()">◀ メニューを閉じる</button>
    <div style="display:flex; gap:4px;"><button class="sidebar-btn" onclick="addFolder()">+フォルダ</button><button class="sidebar-btn" onclick="addFile()">+新しい話</button></div>
    <div id="treeRoot"></div>
</div>
<div class="main-content">
    <div class="controls">
        <button onclick="toggleSidebar()" id="mainMenuBtn" style="display:none;">▶ メニューを開く</button>
        <button onclick="goToParentFolder()">戻る</button>
        <button onclick="document.execCommand('undo')">取り消し</button>
        <button onclick="document.execCommand('redo')">やり直し</button>
        <button onclick="document.execCommand('cut')">カット</button>
        <button onclick="copyText()">コピー</button>
        <button class="btn-check" onclick="checkHiddenChars()">隠し文字</button>
        <button class="btn-check" onclick="checkHomographs()">ホモグラフ</button>
        <button class="btn-check" onclick="checkProofread()">誤字チェック</button>
        <div class="select-wrapper"><label>1行:</label><select id="widthSelect" onchange="changeWidth()"></select></div>
        <div class="counter"><span id="charCount">0</span> 文字</div>
        <span id="saveStatus" style="font-size:12px; color:#aaa;">保存完了</span>
    </div>
    <div class="editor-container">
        <div class="editor-wrapper" id="editorWrapper"><div class="line-numbers" id="lineNumbers">1</div><div id="editor" contenteditable="true"><div><br></div></div></div>
        <div id="proofPanel"><b style="color:#db2777;">🔍 指摘一覧</b><div id="proofList"></div></div>
    </div>
</div>
